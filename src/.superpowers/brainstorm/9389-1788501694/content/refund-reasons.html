<p class="subtitle">아래는 모달 안의 드롭다운 예시입니다. 추가/제거할 항목이 있으면 터미널에 알려주세요.</p>

<div class="mockup-form">
  <h3>환불 사유 선택 <span style="font-size:13px;color:#868e96;font-weight:400">(예시 UI)</span></h3>

  <div class="form-group">
    <label class="form-label">환불 사유 <span style="color:#e55039">*</span></label>
    <select class="form-select">
      <option value="">-- 사유를 선택해주세요 --</option>
      <option>단순 변심</option>
      <option>상품 불량 / 파손</option>

      <option>배송 지연</option>
      <option>상품 설명과 다름</option>
      <option>중복 주문</option>
